[project]
name = "multimodal-rag"
version = "0.2.0"
description = "DocMind AI — multimodal document intelligence and RAG assistant (Gemini + ChromaDB + Streamlit)"
requires-python = ">=3.10"

dependencies = [
    "google-genai>=1.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.6.0",
    "pypdf>=5.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]